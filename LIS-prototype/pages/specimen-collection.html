<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>标本采集 - LIS 临床实验室信息系统</title>
  <link rel="stylesheet" href="../colors_and_type.css">
  <style id="critical-layout">
    /* ============================================================
       LIS Shell — Critical Layout
       All colors reference CSS variables from colors_and_type.css
       ============================================================ */

    /* ---------- Reset & Base ---------- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      color: var(--lis-foreground);
      background: var(--lis-background);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    a { text-decoration: none; color: inherit; }

    /* ---------- App Container ---------- */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100%;
      overflow: hidden;
    }

    /* ---------- App Header ---------- */
    .app-header {
      height: 56px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: var(--lis-background);
      border-bottom: 1px solid var(--lis-border);
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
      background: var(--lis-primary);
      color: var(--lis-primary-foreground);
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 0.02em;
    }
    .system-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--lis-foreground);
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .header-datetime {
      font-size: 13px;
      color: var(--lis-muted-foreground);
    }
    .header-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-full);
      background: var(--color-primary-50);
      color: var(--color-primary-600);
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .user-meta {
      display: flex;
      flex-direction: column;
      line-height: 1.25;
    }
    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--lis-foreground);
    }
    .user-role {
      font-size: 12px;
      color: var(--lis-muted-foreground);
    }

    /* ---------- App Body ---------- */
    .app-body {
      display: flex;
      flex: 1;
      min-height: 0;
    }

    /* ---------- App Sidebar ---------- */
    .app-sidebar {
      width: 200px;
      flex-shrink: 0;
      background: var(--lis-background);
      border-right: 1px solid var(--lis-border);
      padding: 8px 0;
      overflow-y: auto;
    }
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      margin: 0 8px;
      font-size: 14px;
      color: var(--lis-muted-foreground);
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
      user-select: none;
    }
    .nav-item:hover {
      background: var(--color-neutral-50);
      color: var(--lis-foreground);
    }
    .nav-item.active {
      background: var(--color-primary-50);
      color: var(--color-primary-600);
      font-weight: 600;
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ---------- App Main ---------- */
    .app-main {
      flex: 1;
      min-width: 0;
      padding: 24px;
      overflow-y: auto;
      background: var(--color-neutral-50);
    }

    /* ---------- Page Header Slot ---------- */
    .page-header {
      margin-bottom: 20px;
    }
    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      color: var(--lis-foreground);
      line-height: 32px;
    }
    .page-content {
      /* Slot container for page body content */
    }
  </style>
  <style id="page-styles">
    /* ============================================================
       标本采集 (Specimen Collection) — Page Styles
       All colors reference CSS variables from colors_and_type.css
       ============================================================ */

    /* ---------- Collection Card ---------- */
    .collection-card {
      background: var(--lis-card);
      border: 1px solid var(--lis-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 20px;
    }

    /* ---------- Scan Area ---------- */
    .scan-area {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
      background: var(--color-neutral-50);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 20px;
    }
    .scan-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--lis-primary);
      flex-shrink: 0;
    }
    .scan-input {
      flex: 1;
      height: 40px;
      border: 1px solid var(--lis-border);
      border-radius: var(--radius-md);
      padding: 0 12px;
      font-size: 14px;
      background: var(--lis-background);
      color: var(--lis-foreground);
      outline: none;
      font-family: var(--font-sans);
    }
    .scan-input::placeholder {
      color: var(--lis-muted-foreground);
    }
    .scan-input:focus {
      border-color: var(--lis-primary);
    }
    .scan-hint {
      font-size: 12px;
      color: var(--lis-muted-foreground);
      flex-shrink: 0;
    }

    /* ---------- Patient Info ---------- */
    .patient-info {
      margin-bottom: 20px;
    }
    .info-row {
      display: flex;
      flex-direction: row;
      gap: 24px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .info-label {
      font-size: 12px;
      color: var(--lis-muted-foreground);
    }
    .info-value {
      font-size: 14px;
      font-weight: 500;
      color: var(--lis-foreground);
    }
    .identity-verified {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      font-size: 13px;
      color: var(--state-success);
      background: var(--state-success-bg);
      padding: 6px 12px;
      border-radius: 6px;
    }
    .identity-verified svg {
      flex-shrink: 0;
    }

    /* ---------- Section Divider ---------- */
    .section-divider {
      height: 1px;
      background: var(--lis-border);
      margin: 20px 0;
    }

    /* ---------- Section Label ---------- */
    .section-label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--lis-foreground);
    }

    /* ---------- Collection Items ---------- */
    .collection-items {
      margin-bottom: 20px;
    }
    .collection-item {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid var(--lis-border);
      border-radius: var(--radius-md);
      margin-bottom: 8px;
      background: var(--lis-background);
    }
    .item-info {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    .item-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--lis-foreground);
    }
    .item-container {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: var(--lis-muted-foreground);
    }
    .container-tag {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      font-weight: 500;
    }

    /* ---------- Print Button ---------- */
    .btn-print {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      padding: 6px 12px;
      border: 1px solid var(--lis-border);
      border-radius: 6px;
      background: var(--lis-background);
      font-size: 13px;
      cursor: pointer;
      color: var(--lis-primary);
      font-family: var(--font-sans);
      transition: background-color 0.2s ease;
    }
    .btn-print:hover {
      background: var(--color-primary-50);
    }
    .btn-print svg {
      flex-shrink: 0;
    }

    /* ---------- Action Row ---------- */
    .action-row {
      display: flex;
      flex-direction: row;
      gap: 12px;
    }
    .btn-primary {
      padding: 10px 24px;
      background: var(--lis-primary);
      color: var(--lis-primary-foreground);
      border: none;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background-color 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--color-primary-600);
    }
    .btn-warning {
      padding: 10px 24px;
      background: var(--lis-background);
      color: var(--state-warning);
      border: 1px solid var(--state-warning);
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background-color 0.2s ease;
    }
    .btn-warning:hover {
      background: var(--state-warning-bg);
    }
    .btn-ghost {
      padding: 10px 24px;
      background: var(--lis-background);
      color: var(--lis-muted-foreground);
      border: 1px solid var(--lis-border);
      border-radius: var(--radius-md);
      font-size: 14px;
      cursor: pointer;
      font-family: var(--font-sans);
      transition: background-color 0.2s ease;
    }
    .btn-ghost:hover {
      background: var(--color-neutral-50);
    }

    /* ---------- Recent Records ---------- */
    .recent-records {
      background: var(--lis-card);
      border: 1px solid var(--lis-border);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .record-item {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--color-neutral-100);
    }
    .record-item:last-child {
      border-bottom: none;
    }
    .record-time {
      font-size: 13px;
      color: var(--lis-muted-foreground);
      font-family: var(--font-mono);
      min-width: 50px;
    }
    .record-patient {
      font-size: 14px;
      font-weight: 500;
      color: var(--lis-foreground);
      min-width: 60px;
    }
    .record-project {
      font-size: 13px;
      color: var(--lis-muted-foreground);
      flex: 1;
    }
    .record-status {
      font-size: 13px;
      font-weight: 500;
      min-width: 70px;
    }
    .btn-undo {
      font-size: 13px;
      color: var(--lis-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      font-family: var(--font-sans);
      padding: 4px 8px;
    }
    .btn-undo:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="logo">LIS</div>
        <span class="system-title">临床实验室信息系统</span>
      </div>
      <div class="header-right">
        <span class="header-datetime">2026-08-15 10:30:00</span>
        <div class="header-user">
          <span class="user-avatar">张</span>
          <div class="user-meta">
            <span class="user-name">张三</span>
            <span class="user-role">检验技师</span>
          </div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar -->
      <aside class="app-sidebar">
        <nav class="sidebar-nav">
          <!-- SLOT: activeNavItem -->
          <a class="nav-item active" data-nav-key="collection" data-dom-id="nav-collection">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6"/><path d="M10 3v6L4.5 18a2 2 0 0 0 1.7 3h11.6a2 2 0 0 0 1.7-3L14 9V3"/><path d="M7.5 14h9"/></svg>
            <span>标本采集</span>
          </a>
          <a class="nav-item" data-nav-key="transport">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7.5" cy="18.5" r="2.5"/><path d="M15 18.5h-4"/><circle cx="17.5" cy="18.5" r="2.5"/></svg>
            <span>标本送检</span>
          </a>
          <a class="nav-item" data-nav-key="receipt">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span>标本签收</span>
          </a>
          <a class="nav-item" data-nav-key="workstation">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>
            <span>技师工作站</span>
          </a>
          <a class="nav-item" data-nav-key="report">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            <span>报告查询</span>
          </a>
        </nav>
      </aside>

      <!-- Main content -->
      <main class="app-main">
        <div class="page-header">
          <h1 class="page-title">标本采集</h1>
        </div>
        <div class="page-content">
          <!-- Main collection card -->
          <div class="collection-card">
            <!-- Scan input area -->
            <div class="scan-area">
              <div class="scan-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 8v8"/><path d="M11 8v8"/><path d="M15 8v8"/><path d="M19 8v8"/></svg>
              </div>
              <input type="text" class="scan-input" placeholder="扫描申请单/腕带条码..." />
              <div class="scan-hint">支持扫码枪连续扫描</div>
            </div>

            <!-- Patient info (shown after scan) -->
            <div class="patient-info">
              <div class="info-row">
                <span class="info-label">患者姓名</span>
                <span class="info-value">张三</span>
                <span class="info-label">性别/年龄</span>
                <span class="info-value">男 35岁</span>
                <span class="info-label">门诊号</span>
                <span class="info-value">M20260815001</span>
              </div>
              <div class="identity-verified">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                身份核对通过 (腕带+申请单双向扫码)
              </div>
            </div>

            <!-- Separator -->
            <div class="section-divider"></div>

            <!-- Collection items (auto-matched containers) -->
            <div class="collection-items">
              <div class="section-label">待采项目 (容器已自动匹配)</div>

              <div class="collection-item">
                <div class="item-info">
                  <span class="item-name">血常规</span>
                  <span class="item-container">
                    <span class="container-tag" style="background: var(--color-primary-50); color: var(--color-primary-600);">紫色 EDTA管</span>
                    ×1
                  </span>
                </div>
                <button class="btn-print">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                  打印条码
                </button>
              </div>

              <div class="collection-item">
                <div class="item-info">
                  <span class="item-name">生化全套</span>
                  <span class="item-container">
                    <span class="container-tag" style="background: #FEF2F2; color: #DC2626;">红色 促凝管</span>
                    ×1
                  </span>
                </div>
                <button class="btn-print">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                  打印条码
                </button>
              </div>

              <div class="collection-item">
                <div class="item-info">
                  <span class="item-name">凝血四项</span>
                  <span class="item-container">
                    <span class="container-tag" style="background: #EFF6FF; color: #2563EB;">蓝色 枸橼酸钠管</span>
                    ×1
                  </span>
                </div>
                <button class="btn-print">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                  打印条码
                </button>
              </div>
            </div>

            <!-- Separator -->
            <div class="section-divider"></div>

            <!-- Action buttons -->
            <div class="action-row">
              <button class="btn-primary">确认采集</button>
              <button class="btn-warning">采集失败</button>
              <button class="btn-ghost">跳过</button>
            </div>
          </div>

          <!-- Recent collection records -->
          <div class="recent-records">
            <div class="section-label">最近采集记录 (5分钟内可撤销)</div>
            <div class="record-item">
              <span class="record-time">10:23</span>
              <span class="record-patient">张三</span>
              <span class="record-project">血常规</span>
              <span class="record-status" style="color: var(--state-success);">已采集</span>
              <button class="btn-undo">撤销</button>
            </div>
            <div class="record-item">
              <span class="record-time">10:20</span>
              <span class="record-patient">李四</span>
              <span class="record-project">尿常规</span>
              <span class="record-status" style="color: var(--state-success);">已采集</span>
              <button class="btn-undo">撤销</button>
            </div>
            <div class="record-item">
              <span class="record-time">10:18</span>
              <span class="record-patient">王五</span>
              <span class="record-project">生化全套</span>
              <span class="record-status" style="color: var(--state-error);">采集失败</span>
              <button class="btn-undo">查看</button>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
