# =============================================================================
# LIS 临床检验系统 - Nginx 前端配置 (Docker 部署)
# 服务 80 端口: 提供前端静态资源, 并将 /api 反向代理到后端容器 backend:8080
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip 压缩
    gzip  on;
    gzip_min_length    1k;
    gzip_buffers       4 16k;
    gzip_comp_level    6;
    gzip_types         text/plain text/css text/javascript application/javascript application/json application/xml;
    gzip_vary          on;

    # 客户端上传大小限制 (报告 PDF / 附件 / 图片)
    client_max_body_size 50m;

    # API 上游: 后端单体容器 (docker-compose 服务名 backend)
    upstream lis_backend {
        server backend:8080;
    }

    server {
        listen       80;
        server_name  _;

        # 前端静态资源 / 单页应用
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # 后端 API 反向代理
        location /api/ {
            proxy_pass http://lis_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持 (仪器实时通信推送)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # 静态资源缓存
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
            root  /usr/share/nginx/html;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}