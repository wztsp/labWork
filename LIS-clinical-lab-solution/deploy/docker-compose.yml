# =============================================================================
# LIS 临床检验系统 - Docker Compose 一键部署 (单机/单容器编排)
# 组件: PostgreSQL + Redis + RabbitMQ + 后端单体(8080/9100) + 前端 Nginx(3000)
# 使用:  cd deploy && docker compose up -d --build
# =============================================================================

name: lis

services:
  # ---------- 数据库 ----------
  postgres:
    image: postgres:15
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 首次启动自动执行全量初始化脚本 (结构+字典, 不含 demo 业务数据)
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ---------- 缓存 ----------
  redis:
    image: redis:7
    container_name: lis-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ---------- 消息队列 ----------
  rabbitmq:
    image: rabbitmq:3-management
    container_name: lis-rabbitmq
    restart: unless-stopped
    environment:
      # 创建默认用户与虚拟主机 (与后端 application.yml 一致)
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    ports:
      - "${RABBITMQ_AMQP_PORT}:5672"   # AMQP
      - "${RABBITMQ_MGMT_PORT}:15672" # 管理台
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ---------- 后端 (单体 jar, 含 HTTP + TCP 仪器通信) ----------
  backend:
    build:
      context: ../lis-system
      dockerfile: lis-monolith/Dockerfile
    container_name: lis-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # 覆盖 application.yml 中的 localhost -> 容器服务名
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_DATABASE: "${REDIS_DATABASE}"
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST}
    ports:
      - "${BACKEND_HTTP_PORT}:8080"   # HTTP
      - "${BACKEND_TCP_PORT}:9100"    # TCP 仪器通信
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ---------- 前端 (Nginx 静态 + 反向代理 /api -> backend) ----------
  frontend:
    image: nginx:alpine
    container_name: lis-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT}:80"     # 访问地址 http://localhost:3000
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      # 前端构建产物 (请先执行前端构建, 见 README)
      - ../lis-frontend/dist:/usr/share/nginx/html:ro

volumes:
  pg_data: