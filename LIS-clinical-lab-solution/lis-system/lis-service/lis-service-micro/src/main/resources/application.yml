server:
  port: 8093

spring:
  application:
    name: lis-service-micro
  datasource:
    url: jdbc:postgresql://localhost:5432/lis_db
    username: lis_user
    password: ${DB_PASSWORD:lis_dev_2026}
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    port: 6379
    database: 9
    timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.lis.micro: debug
