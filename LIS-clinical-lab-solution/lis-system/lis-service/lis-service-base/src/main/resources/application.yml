server:
  port: 8085

spring:
  application:
    name: lis-service-base
  datasource:
    url: jdbc:postgresql://localhost:5432/lis_db
    username: lis_user
    password: ${DB_PASSWORD:lis_dev_2026}
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    port: 6379
    database: 2
    timeout: 5000
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

logging:
  level:
    com.lis.base: debug
