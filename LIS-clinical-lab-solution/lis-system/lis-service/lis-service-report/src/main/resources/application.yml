server:
  port: 8082

spring:
  application:
    name: lis-service-report
  datasource:
    url: jdbc:postgresql://localhost:5432/lis_db
    username: lis_user
    password: ${DB_PASSWORD:lis_dev_2026}
    driver-class-name: org.postgresql.Driver
  redis:
    host: localhost
    port: 6379
    database: 3
    timeout: 5000
  rabbitmq:
    host: localhost
    port: 5672
    username: lis
    password: ${MQ_PASSWORD:lis_dev_2026}
    virtual-host: /lis
    listener:
      simple:
        # 当 RabbitMQ 不可用时, 不阻止服务启动, 仅记录错误日志
        auto-startup: false
        missing-queues-fatal: false
        missing-exchange-fatal: false
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 报告服务业务配置
report:
  pdf:
    storage-path: /data/lis/pdf
  audit:
    auto-enabled: true
  critical:
    alert-queue: critical.alert
    confirm-timeout-seconds: 1800

# MQ 队列/交换机配置
mq:
  exchange: lis.exchange
  report:
    published-queue: report.published
    published-routing-key: report.published
    instrument-result-queue: lis.report.instrument-result
    instrument-result-routing-key: instrument.result.received
  critical:
    alert-queue: critical.alert
    alert-routing-key: critical.alert

logging:
  level:
    com.lis.report: debug
