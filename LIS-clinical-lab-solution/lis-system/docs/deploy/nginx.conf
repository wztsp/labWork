# =============================================================================
# LIS 临床检验系统 Nginx 反向代理配置
# 前端代理 -> 3000 端口 (Vue/React 开发或构建产物服务)
# API 代理  -> 8080 端口 (Spring Cloud Gateway 网关)
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 日志格式
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log   warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # gzip 压缩
    gzip  on;
    gzip_min_length    1k;
    gzip_buffers       4 16k;
    gzip_comp_level    6;
    gzip_types         text/plain text/css text/javascript application/javascript application/json application/xml;
    gzip_vary          on;

    # 客户端上传大小限制 (报告 PDF / 附件)
    client_max_body_size 50m;

    # 上游服务: 前端
    upstream lis_frontend {
        server 127.0.0.1:3000;
    }

    # 上游服务: API 网关 (Spring Cloud Gateway)
    upstream lis_gateway {
        server 127.0.0.1:8080;
    }

    server {
        listen       80;
        server_name  _;

        # 前端静态资源 / 单页应用
        location / {
            proxy_pass http://lis_frontend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API 接口代理 -> 8080 网关
        location /api/ {
            proxy_pass http://lis_gateway;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 支持 (仪器实时通信推送)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 3600s;
        }

        # 静态资源缓存
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://lis_frontend;
            proxy_set_header Host $host;
            expires 7d;
            add_header Cache-Control "public, no-transform";
        }
    }
}
