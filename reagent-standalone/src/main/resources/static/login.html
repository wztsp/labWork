<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录 - 试剂管理系统</title>
  <style>
    :root {
      --brand: #1f6feb;
      --brand-dark: #1552b8;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                   "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: #eef2f8;
      background-image:
        radial-gradient(1100px 600px at 12% 8%, rgba(31, 111, 235, 0.18), transparent 60%),
        radial-gradient(900px 500px at 92% 92%, rgba(16, 185, 129, 0.14), transparent 60%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(15, 23, 42, 0.12);
      padding: 40px 34px 32px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }
    .logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), #4f9dff);
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: .5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand h1 { font-size: 19px; margin: 0; font-weight: 600; }
    .brand p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #374151; margin-bottom: 7px; }
    .field input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      font-size: 14px;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fbfcfe;
      outline: none;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .field input:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.14);
    }
    .error {
      min-height: 18px;
      font-size: 12.5px;
      color: var(--danger);
      margin: -4px 0 10px;
    }
    .btn {
      width: 100%;
      height: 44px;
      border: 0;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--brand);
      cursor: pointer;
      transition: background .18s, transform .06s;
    }
    .btn:hover { background: var(--brand-dark); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { background: #9dbcf5; cursor: not-allowed; }
    .foot {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <form class="card" id="loginForm" autocomplete="on">
    <div class="brand">
      <div class="logo">LIS</div>
      <div>
        <h1>试剂管理系统</h1>
        <p>Reagent Management</p>
      </div>
    </div>

    <div class="field">
      <label for="username">账号</label>
      <input id="username" name="username" type="text" placeholder="请输入账号" autocomplete="username" required />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required />
    </div>

    <div class="error" id="error"></div>
    <button class="btn" id="submitBtn" type="submit">登 录</button>
    <div class="foot">© 试剂管理系统 · 内网使用</div>
  </form>

  <script>
    (function () {
      var form = document.getElementById('loginForm');
      var btn = document.getElementById('submitBtn');
      var errBox = document.getElementById('error');
      var userInput = document.getElementById('username');

      userInput.focus();

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.textContent = '';

        var username = userInput.value.trim();
        var password = document.getElementById('password').value;
        if (!username || !password) {
          errBox.textContent = '请输入账号和密码';
          return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) { return res.json(); })
          .then(function (body) {
            if (body && body.code === 200) {
              window.location.replace('/');
              return;
            }
            errBox.textContent = (body && body.message) || '登录失败，请重试';
            btn.disabled = false;
            btn.textContent = '登 录';
          })
          .catch(function () {
            errBox.textContent = '网络异常，无法连接服务';
            btn.disabled = false;
            btn.textContent = '登 录';
          });
      });
    })();
  </script>
</body>
</html>
