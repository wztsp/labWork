server:
  port: ${SERVER_PORT:8092}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      timeout: 8h

# 登录账号（不依赖数据库；改完重启服务生效）
app:
  login:
    enabled: true
    username: admin
    password: admin123
    session-timeout-minutes: 480

spring:
  application:
    name: lis-reagent
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:lis_reagent}?characterEncoding=utf8
    username: ${DB_USER:lis_reagent}
    password: ${DB_PASSWORD:lis_reagent_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: auto

# 试剂业务配置
reagent:
  expiry:
    near-expiry-days: 30      # 近效期预警天数
    long-term-expiry-days: 90 # 长期效期预警天数

logging:
  level:
    root: info
    com.lis.reagent: info
  file:
    name: ${LOG_PATH:./logs}/lis-reagent.log
